<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Mind Scape</title>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.7.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-blink-controls/dist/aframe-blink-controls.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-cursor-teleport@1.6.0/dist/aframe-cursor-teleport-component.min.js"></script>
    <script src="./go-to.js"></script>
    <script>
      // Helper function to safely transition ambient tracks
      function transitionAmbientSound(newSoundAssetId) {
        const ambientEntity = document.querySelector("#ambient-sound-track");
        if (!ambientEntity) return;

        // Stop whatever is currently playing
        if (ambientEntity.components.sound) {
          ambientEntity.components.sound.stopSound();
        }

        // Switch the source asset target and play
        ambientEntity.setAttribute("sound", {
          src: newSoundAssetId,
          loop: true,
          autoplay: true,
          volume: 0.5,
          positional: false,
        });
      }

      // New component to trigger negative ambient tracks when clicking the floor
      AFRAME.registerComponent("room-entry-sound", {
        schema: {
          targetTrack: { type: "string" },
        },
        init: function () {
          this.el.addEventListener("click", () => {
            if (!this.activated) {
              console.log(
                "Stepped into new room, playing: " + this.data.targetTrack,
              );
              transitionAmbientSound(this.data.targetTrack);
              this.activated = true;
              this.el.classList.remove("clickable");
            }
          });
        },
      });

      AFRAME.registerComponent("elevator-up", {
        init: function () {
          this.el.addEventListener("click", () => {
            document.querySelector("#doors").removeAttribute("animation-mixer");
            document
              .querySelector("#doors")
              .setAttribute(
                "animation-mixer",
                "clip:*; loop:once;clampWhenFinished: true",
              );
            document
              .querySelector("#elevatorFloor")
              .setAttribute(
                "animation",
                "property:position;to:0 5 0;dur: 2000;easing: easeInOutQuad",
              );

            // Start Room 1 Creepy Sound Track
            transitionAmbientSound("#negativeSoundRoom1");
          });
        },
      });

      AFRAME.registerComponent("elevator-down", {
        init: function () {
          this.el.addEventListener("click", () => {
            document
              .querySelector("#elevatorFloor")
              .setAttribute(
                "animation",
                "property:position;to:0 0 0;dur: 2000;easing: easeInOutQuad",
              );
          });
        },
      });

      AFRAME.registerComponent("lamp-switch", {
        init: function () {
          this.el.sceneEl.addEventListener("loaded", () => {
            const lampLight = document.querySelector("#lamplight-int");
            const roomLight = document.querySelector("#room1-ligt");
            const roomDoor = document.querySelector("#room-door");
            if (lampLight) lampLight.setAttribute("light", "intensity", 0);
            if (roomLight) roomLight.setAttribute("light", "intensity", 2);

            this.el.addEventListener("click", () => {
              // Play contextual one-off physical button sound
              const lampSound = document.querySelector("#lamp-sound");
              if (lampSound && lampSound.components.sound) {
                lampSound.components.sound.playSound();
              }

              // Shift Room 1 atmosphere to Positive
              transitionAmbientSound("#positiveSoundRoom1");

              if (lampLight) {
                lampLight.setAttribute("animation", {
                  property: "light.intensity",
                  from: 0,
                  to: 4,
                  dur: 1500,
                  easing: "easeOutQuad",
                });
              }
              if (roomLight) {
                roomLight.setAttribute(
                  "animation",
                  "property: light.intensity; from: 2; to: 8; dur: 1500; easing: easeOutQuad",
                );
              }
              if (roomDoor) {
                roomDoor.removeAttribute("animation");
                roomDoor.removeAttribute("animation-mixer");
                roomDoor.setAttribute(
                  "animation-mixer",
                  "clip: *; loop: once; clampWhenFinished: true",
                );
                const triggerzone = document.querySelector("#close-trigger");
                if (triggerzone) {
                  triggerzone.components["door-closer"].hasClosed = false;
                }
              }
            });
          });
        },
      });

      AFRAME.registerComponent("door-closer", {
        schema: {
          doorTarget: { type: "selector" },
          isAnimatedGlb: { type: "boolean", default: false },
          closeDistance: { type: "number", default: 5.0 },
        },
        init: function () {
          this.playerHead = document.querySelector("#head");
          this.hasClosed = true;
          this.playerWorldPos = new THREE.Vector3();
          this.triggerWorldPos = new THREE.Vector3();
        },
        tick: function () {
          if (!this.hasClosed || !this.playerHead || !this.data.doorTarget)
            return;

          this.playerHead.object3D.getWorldPosition(this.playerWorldPos);
          this.el.object3D.getWorldPosition(this.triggerWorldPos);

          let distance = this.playerWorldPos.distanceTo(this.triggerWorldPos);
          let effectiveCloseDistance = this.data.closeDistance * 0.7;

          if (distance < effectiveCloseDistance) {
            const targetDoor = this.data.doorTarget;
            if (this.data.isAnimatedGlb) {
              targetDoor.removeAttribute("animation-mixer");
              let clipName = "*";
              if (targetDoor.id === "room-door2") {
                clipName = "door 2Action";
              } else if (targetDoor.id === "door3-entity") {
                clipName = "door 3Action";
              } else if (targetDoor.id === "door4-entity") {
                clipName = "open";
              } else if (targetDoor.id === "door5-entity") {
                clipName = "*";
              }
              targetDoor.setAttribute(
                "animation-mixer",
                `clip: ${clipName}; loop: once; clampWhenFinished: true; timeScale: -1`,
              );
              console.log(
                "Player safely inside next room. " +
                  targetDoor.id +
                  " closing.",
              );
            } else {
              targetDoor.removeAttribute("animation-mixer");
              targetDoor.setAttribute(
                "animation",
                "property: rotation; to: 0 0 0; dur: 1500; easing: easeInOutQuad",
              );
              console.log("Player entered Room. Door rotated shut!");
            }

            this.el.removeAttribute("door-closer");
          }
        },
      });

      AFRAME.registerComponent("interactive-frame", {
        init: function () {
          window.isCarryingFrame = false;
          this.el.addEventListener("click", () => {
            if (!window.isCarryingFrame) {
              window.isCarryingFrame = true;
              console.log("Floor frame picked up!");
              this.el.setAttribute("visible", "false");
              this.el.classList.remove("clickable");
            }
          });

          this.el.sceneEl.addEventListener("loaded", () => {
            const nail = document.querySelector("#nail-entity");
            const frameOnWall = document.querySelector("#frame2-entity");
            const roomDoor2 = document.querySelector("#room-door2");
            const room2Light = document.querySelector("#room2-light");
            if (nail) {
              nail.addEventListener("click", () => {
                if (window.isCarryingFrame) {
                  window.isCarryingFrame = false;
                  console.log("Wall frame revealed on the nail!");

                  // Room 2 Puzzle Solved -> Transition Ambient Track
                  transitionAmbientSound("#positiveSoundRoom2");

                  if (frameOnWall) {
                    frameOnWall.setAttribute("visible", "true");
                  }
                  if (room2Light) {
                    room2Light.setAttribute(
                      "animation",
                      "property: light.intensity; from: 5; to: 8; dur: 1500; easing: easeOutQuad",
                    );
                  }
                  if (roomDoor2) {
                    roomDoor2.removeAttribute("animation-mixer");
                    roomDoor2.setAttribute(
                      "animation-mixer",
                      "clip: door 2Action; loop: once; clampWhenFinished: true; timeScale: 1",
                    );
                    const triggerZone3 =
                      document.querySelector("#room3-trigger");
                    if (triggerZone3) {
                      triggerZone3.components["door-closer"].hasClosed = false;
                    }
                  }
                  nail.classList.remove("clickable");
                }
              });
            }
          });
        },
      });

      AFRAME.registerComponent("board-fade", {
        init: function () {
          this.clickCount = 0;
          this.currentOpacity = 1.0;
          this.el.addEventListener("click", () => {
            if (this.clickCount >= 5) return;
            this.clickCount++;
            this.currentOpacity -= 0.2;
            const mesh = this.el.getObject3D("mesh");
            if (mesh) {
              mesh.traverse((node) => {
                if (node.isMesh && node.material) {
                  node.material.transparent = true;
                  node.material.opacity = this.currentOpacity;
                  node.material.needsUpdate = true;
                }
              });
            }
            if (this.clickCount >= 5) {
              this.el.setAttribute("visible", "false");
              this.el.classList.remove("clickable");
              console.log("Image is gone! Activating Room 3 sequence...");

              // Room 3 Puzzle Solved -> Transition Ambient Track
              transitionAmbientSound("#positiveSoundRoom3");

              const light1 = document.querySelector("#room3-light");
              if (light1) {
                light1.setAttribute(
                  "animation",
                  "property: light.intensity; from: 4; to: 8; dur: 2000; easing: easeOutQuad",
                );
              }
              const light2 = document.querySelector("#room3-light-2");
              if (light2) {
                light2.setAttribute(
                  "animation",
                  "property: light.intensity; from: 1; to: 6; dur: 2000; easing: easeOutQuad",
                );
              }
              const door3 = document.querySelector("#door3-entity");
              if (door3) {
                door3.removeAttribute("animation-mixer");
                door3.setAttribute(
                  "animation-mixer",
                  "clip: *; loop: once; clampWhenFinished: true; timeScale: 1",
                );
                console.log("Door 3 animation triggered.");
                const triggerZone4 = document.querySelector("#room4-trigger");
                if (triggerZone4) {
                  triggerZone4.components["door-closer"].hasClosed = false;
                }
              }
            }
          });
        },
      });

      AFRAME.registerComponent("watering-puzzle", {
        init: function () {
          window.isCarryingWatercan = false;
          this.puzzleSolved = false;
          const waterCanEl = document.querySelector("#watercan-click");
          if (waterCanEl) {
            waterCanEl.addEventListener("click", () => {
              if (!window.isCarryingWatercan && !this.puzzleSolved) {
                window.isCarryingWatercan = true;
                console.log("Water can picked up!");
                waterCanEl.setAttribute("visible", "false");
                waterCanEl.classList.remove("clickable");
              }
            });
          }
          this.el.addEventListener("click", () => {
            if (window.isCarryingWatercan && !this.puzzleSolved) {
              this.puzzleSolved = true;
              console.log(
                "Small plant watered! Triggering all Room 4 systems...",
              );

              // Room 4 Puzzle Solved -> Transition Ambient Track
              transitionAmbientSound("#positiveSoundRoom4");

              this.el.removeAttribute("animation-mixer");
              this.el.setAttribute(
                "animation-mixer",
                "clip: *; loop: once; clampWhenFinished: true",
              );
              this.el.classList.remove("clickable");
              const r4Light1 = document.querySelector("#room4-light-1");
              const r4Light2 = document.querySelector("#room4-light-2");
              const door4 = document.querySelector("#door4-entity");
              if (r4Light1) {
                r4Light1.setAttribute(
                  "animation",
                  "property: light.intensity; from: 3; to: 8; dur: 2000; easing: easeOutQuad",
                );
              }
              if (r4Light2) {
                r4Light2.setAttribute(
                  "animation",
                  "property: light.intensity; from: 3; to: 8; dur: 2000; easing: easeOutQuad",
                );
              }
              if (door4) {
                door4.removeAttribute("animation-mixer");
                door4.setAttribute(
                  "animation-mixer",
                  "clip: open; loop: once; clampWhenFinished: true; timeScale: 1",
                );
                console.log("Door 4 animation opened.");
                const triggerZone5 = document.querySelector("#room5-trigger");
                if (triggerZone5 && triggerZone5.components["door-closer"]) {
                  triggerZone5.components["door-closer"].hasClosed = false;
                }
              }
            }
          });
        },
      });

      AFRAME.registerComponent("candle-puzzle", {
        init: function () {
          window.isCarryingMatches = false;
          this.puzzleSolved = false;
          const matchesEl = document.querySelector("#matches-entity");
          if (matchesEl) {
            matchesEl.addEventListener("click", () => {
              if (!window.isCarryingMatches && !this.puzzleSolved) {
                window.isCarryingMatches = true;
                console.log("Matches picked up!");
                matchesEl.setAttribute("visible", "false");
                matchesEl.classList.remove("clickable");
              }
            });
          }
          this.el.addEventListener("click", () => {
            if (window.isCarryingMatches && !this.puzzleSolved) {
              this.puzzleSolved = true;
              console.log("Candle clicked with matches! Lighting Room 5");

              // Room 5 Puzzle Solved -> Transition Ambient Track
              transitionAmbientSound("#positiveSoundRoom5");

              const candleOff = document.querySelector("#candle-off-entity");
              const candleOn = document.querySelector("#candle-lit-entity");
              const r5Light = document.querySelector("#room5-light");
              const door5 = document.querySelector("#door5-entity");
              const gameSky = document.querySelector("#gameSky");

              if (candleOff) candleOff.setAttribute("visible", "false");
              if (candleOn) {
                candleOn.setAttribute("visible", "true");
                candleOn.setAttribute(
                  "animation-mixer",
                  "clip: flame; loop: repeat",
                );
              }
              if (r5Light) {
                r5Light.setAttribute(
                  "animation",
                  "property: light.intensity; from: 2; to: 8; dur: 2000; easing: easeOutQuad",
                );
              }
              if (door5) {
                door5.removeAttribute("animation-mixer");
                door5.setAttribute(
                  "animation-mixer",
                  "clip: *; loop: once; clampWhenFinished: true; timeScale: 1",
                );
              }
              if (gameSky) {
                gameSky.setAttribute(
                  "animation",
                  "property: color; from: #000000; to: #ffffff; dur: 3000; easing: easeInOutQuad",
                );
              }
              const triggerZone6 = document.querySelector("#room6-trigger");
              if (triggerZone6?.components["door-closer"]?.hasClosed) {
                triggerZone6.components["door-closer"].hasClosed = false;
              }
              this.el.classList.remove("clickable");
            } else if (!window.isCarryingMatches) {
              console.log(
                "Find the matches before trying to light the candle.",
              );
            }
          });
        },
      });

      AFRAME.registerComponent("end-game-trigger", {
        schema: {
          finishDistance: { type: "number", default: 2.5 },
        },
        init: function () {
          this.playerHead = document.querySelector("#head");
          this.hasFinished = false;
          this.playerWorldPos = new THREE.Vector3();
          this.triggerWorldPos = new THREE.Vector3();
        },
        tick: function () {
          if (this.hasFinished || !this.playerHead) return;
          const triggerZone6 = document.querySelector("#room6-trigger");
          if (
            triggerZone6 &&
            triggerZone6?.components["door-closer"]?.hasClosed
          )
            return;

          this.playerHead.object3D.getWorldPosition(this.playerWorldPos);
          this.el.object3D.getWorldPosition(this.triggerWorldPos);
          this.playerWorldPos.y = 0;
          this.triggerWorldPos.y = 0;

          let distance = this.playerWorldPos.distanceTo(this.triggerWorldPos);
          if (distance < this.data.finishDistance) {
            this.hasFinished = true;
            console.log("End of Room 6 reached! Initiating grand finale...");

            // Room 6 End Reached -> Transition Ambient Track to Room 6 Victory loop
            transitionAmbientSound("#positiveSoundRoom6");

            const endFade = document.querySelector("#endFade");
            if (endFade) {
              endFade.setAttribute("visible", "true");
              endFade.setAttribute(
                "animation",
                "property: material.opacity; from: 0; to: 1; dur: 3000; easing: easeInQuad",
              );
            }
            const endText = document.querySelector("#endText");
            if (endText) {
              setTimeout(() => {
                endText.setAttribute("visible", "true");
              }, 3000);
            }
          }
        },
      });
    </script>
  </head>
  <body>
    <a-scene
      cursor="rayOrigin: mouse"
      raycaster="objects: .clickable; far: 50"
      renderer="colorManagement: true; tonemapping: linear; sortObjects: true"
      light="defaultLightsEnabled: false"
      shadow="type: pcfsoft; autoUpdate: true"
    >
      <a-assets>
        <a-asset-item id="walls" src="Room walls.glb"></a-asset-item>
        <a-asset-item id="full floor" src="FLOOR.glb"></a-asset-item>
        <a-asset-item id="UP" src="elevator button up.glb"></a-asset-item>
        <a-asset-item id="DOWN" src="elevator button down.glb"></a-asset-item>
        <a-asset-item id="floor" src="elevator floor.glb"></a-asset-item>
        <a-asset-item id="doorModel" src="elevator doors.glb"></a-asset-item>
        <a-asset-item id="el-extra" src="elevator extra.glb"></a-asset-item>
        <a-asset-item id="intfloor1" src="int-floor1.glb"></a-asset-item>
        <a-asset-item id="room1" src="room 1.glb"></a-asset-item>
        <a-asset-item id="lamp" src="1-lampfull.glb"></a-asset-item>
        <a-asset-item id="button" src="1-lamp.glb"></a-asset-item>
        <a-asset-item id="door1" src="door 1.glb"></a-asset-item>
        <a-asset-item id="intfloor2" src="int-floor2.glb"></a-asset-item>
        <a-asset-item id="room2" src="room 2.glb"></a-asset-item>
        <a-asset-item id="clock" src="clock.glb"></a-asset-item>
        <a-asset-item id="frame" src="frame.glb"></a-asset-item>
        <a-asset-item id="nail" src="nail.glb"></a-asset-item>
        <a-asset-item id="door2" src="door 2.glb"></a-asset-item>
        <a-asset-item id="frame2" src="frame2.glb"></a-asset-item>
        <a-asset-item id="intfloor3" src="int-floor3.glb"></a-asset-item>
        <a-asset-item id="room3" src="room 3.glb"></a-asset-item>
        <a-asset-item id="whiteboard" src="whiteboard.glb"></a-asset-item>
        <a-asset-item id="boardimage" src="board image.glb"></a-asset-item>
        <a-asset-item id="door3" src="door 3.glb"></a-asset-item>
        <a-asset-item id="intfloor4" src="int-floor4.glb"></a-asset-item>
        <a-asset-item id="room4" src="room 4.glb"></a-asset-item>
        <a-asset-item id="watercan" src="water can.glb"></a-asset-item>
        <a-asset-item
          id="smallplant"
          src="small plant animation.glb"
        ></a-asset-item>
        <a-asset-item id="door4" src="door 4.glb"></a-asset-item>
        <a-asset-item id="intfloor5" src="int-floor5.glb"></a-asset-item>
        <a-asset-item id="room5" src="room 5.glb"></a-asset-item>
        <a-asset-item id="candle2" src="candle animation.glb"></a-asset-item>
        <a-asset-item id="candle1" src="candle off.glb"></a-asset-item>
        <a-asset-item id="door5" src="door 5.glb"></a-asset-item>
        <a-asset-item id="matches" src="matches.glb"></a-asset-item>
        <a-asset-item id="intfloor6" src="int-floor6.glb"></a-asset-item>

        <audio id="clockSound" src="./clock alarm.mp3" preload="auto"></audio>

        <audio
          id="negativeSoundRoom1"
          src="./room1-negative.mp3"
          preload="auto"
        ></audio>
        <audio
          id="positiveSoundRoom1"
          src="./room1-positive.mp3"
          preload="auto"
        ></audio>

        <audio
          id="negativeSoundRoom2"
          src="./room2-negative.mp3"
          preload="auto"
        ></audio>
        <audio
          id="positiveSoundRoom2"
          src="./room2-positive.mp3"
          preload="auto"
        ></audio>

        <audio
          id="negativeSoundRoom3"
          src="./room3-negative.mp3"
          preload="auto"
        ></audio>
        <audio
          id="positiveSoundRoom3"
          src="./room3-positive.mp3"
          preload="auto"
        ></audio>

        <audio
          id="negativeSoundRoom4"
          src="./room4-negative.mp3"
          preload="auto"
        ></audio>
        <audio
          id="positiveSoundRoom4"
          src="./room4-positive.mp3"
          preload="auto"
        ></audio>

        <audio
          id="negativeSoundRoom5"
          src="./room5-negative.mp3"
          preload="auto"
        ></audio>
        <audio
          id="positiveSoundRoom5"
          src="./room5-positive.mp3"
          preload="auto"
        ></audio>

        <audio
          id="positiveSoundRoom6"
          src="./room6-positive.mp3"
          preload="auto"
        ></audio>
      </a-assets>

      <a-entity
        light="type: ambient; color: #1e1e24; intensity: 0.35"
      ></a-entity>

      <a-entity id="ambient-sound-track" sound=""></a-entity>

      <a-entity
        id="cameraRig"
        cursor-teleport="cameraHead: #head; cameraRig: #cameraRig; collisionEntities: .collision; ignoreEntities: .ignoreEntities"
        position="-1 -4.555 -9.8"
        rotation="0 180 0"
      >
        <a-entity id="head" camera="fov:80" look-controls position="0 1.6 0">
          <a-plane
            id="endFade"
            position="0 0 -0.1"
            width="2"
            height="2"
            material="color: #ffffff; transparent: true; opacity: 0; shader: flat"
            visible="false"
          ></a-plane>
          <a-text
            id="endText"
            value="Mind Scape Completed"
            color="#000000"
            width="1.5"
            position="0 0 -0.5"
            visible="false"
          ></a-text>
        </a-entity>
        <a-entity
          laser-controls="hand: left"
          raycaster="objects: .clickable"
          line="color: red; opacity: 0.75"
          blink-controls="collisionEntities: .collision; cameraRig: #cameraRig; teleportOrigin: #head"
        ></a-entity>
        <a-entity
          laser-controls="hand: right"
          raycaster="objects: .clickable"
          line="color: red; opacity: 0.75"
          blink-controls="collisionEntities: .collision; cameraRig: #cameraRig; teleportOrigin: #head"
        ></a-entity>
      </a-entity>

      <a-entity scale="0.7 0.7 0.7">
        <a-gltf-model
          src="#walls"
          class="ignoreEntities"
          position="0 0 0"
          rotation="0 0 0"
          scale="5 5 5"
          shadow="cast:false;receive:true"
        ></a-gltf-model>

        <a-gltf-model
          src="#full floor"
          class="ignoreEntities"
          position="0 0 0"
          rotation="0 0 0"
          scale="5 5 5"
          shadow="cast:false;receive:true"
        ></a-gltf-model>

        <a-entity
          id="El-light"
          light="angle: 60; color: #fff5cc; distance: 20; intensity: 4; penumbra: 0.7; type: spot; castShadow: true; shadowBias: -0.002 ; shadowMapHeight: 2048; shadowMapWidth: 2048; shadowCameraNear: 0.5"
          position="-0.80629 3.90425 -13"
          rotation="-90 0 0"
        ></a-entity>

        <a-gltf-model
          src="#UP"
          class="clickable"
          position="0 0 0"
          rotation="0 0 0"
          scale="5 5 5"
          go-to="position: -1 0 -9.8"
          elevator-up
        ></a-gltf-model>

        <a-gltf-model
          src="#DOWN"
          class="clickable"
          position="0 0 0"
          rotation="0 0 0"
          scale="5 5 5"
          go-to="position: -1 -6 -14"
          elevator-down
        ></a-gltf-model>

        <a-gltf-model
          id="elevatorFloor"
          src="#floor"
          position="0 0 0"
          rotation="0 0 0"
          scale="5 5 5"
          shadow="cast:false;receive:true"
        ></a-gltf-model>

        <a-gltf-model
          id="doors"
          src="#doorModel"
          position="0.2 0 0.13"
          rotation="0 0 0"
          scale="5 5 5"
          shadow="cast:true;receive:true"
        ></a-gltf-model>

        <a-gltf-model
          src="#el-extra"
          position="0 0 0"
          rotation="0 0 0"
          scale="5 5 5"
          shadow="cast:true;receive:true"
        ></a-gltf-model>
