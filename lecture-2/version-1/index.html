<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-sphere
        radius="1"
        material="color: #fec700; emissive: #fec700; emissiveIntensity: 1.84"
        position="0 1 -8"
        scale="1 1 1"
        ><a-entity
          id="earth-orbit-pivot"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 20000; easing: linear"
          ><a-sphere
            id="earth"
            radius="0.3"
            color="lightblue"
            position="6 0 0"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 1000; easing: linear"
            ><a-sphere id="moon" radius="0.1" position="0.6 0 0.6"></a-sphere>
        </a-entity>
         ><a-entity
          id="mercury-orbit-pivot"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear">
          ><a-sphere 
          id="Mercury" radius="0.1" position="2 0 0" color="gray"></a/-sphere>
        </a-entity>
        ><a-entity
          id="Venus-orbit-pivot"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 40000; easing: linear">
        ><a-sphere 
          id="Venus" radius="0.15" position="3 0 2" color="orange"></a/-sphere>
        </a-entity>
        ><a-entity
          id="Saturn-orbit-pivot"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 40000; easing: linear">
          <a-sphere Id="Saturn"
            position="8 0 5"
            radius="0.2"
            ;
            color="pink"
            animation="property: rotation; to: 360 0 0; loop: true; dur: 10000; easing: linear"
            ><a-torus
              id="saturn"
              material="color: #ffa57d; emissive: #f4a4c0; metalness: 1"
              geometry="radiusTubular: 0.04"
              rotation="73.90181528935898 -79.55920055848073 -95.80541883941521"
              scale="0.5 0.5 0.33"
            ></a-torus>
          </a-sphere>
        </a-entity>
      </a-sphere>
      <a-sky color="#1f2140"></a-sky>
      <a-entity light="color: #BBB; type: point" data-aframe-default-light="" aframe-injected="" position="0 1.49645 0"></a-entity>
      <a-entity light="intensity: 3.794; type: spot; castShadow: true" position="-0.15907 1 -6.43851" data-aframe-default-light="" aframe-injected=""></a-entity>
    </a-scene>

  </body>  
</html>
